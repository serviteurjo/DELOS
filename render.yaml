# =========================================================================
# DELOS 2026 — Render Blueprint (serveur d'envoi d'emails)
# Déploie le dossier server/ comme un Web Service Node.
# Variables secrètes saisies dans le dashboard Render (sync: false).
# =========================================================================
services:
  - type: web
    name: delos-2026-email
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://delos2026.vercel.app